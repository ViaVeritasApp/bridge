name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,   goarm: '7' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VER=$(make print-version)
          ARCH='${{ matrix.goarch }}'
          [ "$ARCH" = arm ] && ARCH=armv7
          NAME="bridge_${VER}_${{ matrix.goos }}_${ARCH}"
          BIN=bridge
          [ "${{ matrix.goos }}" = windows ] && BIN=bridge.exe
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X bridge/internal/config.DefaultVersion=${VER}" \
            -o "dist/${BIN}" ./cmd/bridge
          cd dist
          if [ "${{ matrix.goos }}" = windows ]; then
            grep -aq requireAdministrator "${BIN}" \
              || { echo "::error::windows manifest not embedded in ${BIN}"; exit 1; }
            zip "${NAME}.zip" "${BIN}"
            ARTIFACT="${NAME}.zip"
          elif [ "${{ matrix.goos }}" = darwin ]; then
            tar -czf "${NAME}.tar.gz" "${BIN}"
            ARTIFACT="${NAME}.tar.gz"
          else
            cp "${GITHUB_WORKSPACE}/packaging/linux/bridge.desktop" .
            tar -czf "${NAME}.tar.gz" "${BIN}" bridge.desktop
            rm -f bridge.desktop
            ARTIFACT="${NAME}.tar.gz"
          fi
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          rm -f "${BIN}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS.txt

      # Bridges update themselves only to a release whose checksums are signed
      # with a key compiled into them (internal/selfupdate/keys.go).
      - name: Sign checksums
        env:
          BRIDGE_UPDATE_SIGNING_KEY: ${{ secrets.BRIDGE_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BRIDGE_UPDATE_SIGNING_KEY}" ]; then
            echo "::warning::BRIDGE_UPDATE_SIGNING_KEY isn't set: this release isn't signed, so no bridge updates to it by itself"
            exit 0
          fi
          go run ./tools/sign sign dist/SHA256SUMS.txt > dist/SHA256SUMS.txt.sig

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt*
          generate_release_notes: true
          fail_on_unmatched_files: true
